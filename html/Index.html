<!DOCTYPE html >
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <Link rel="stylesheet" href="../css/Style.css">
    <link rel="stylesheet" href="../css/EditarModal.css">
    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <title>Registro Vehicular</title>
</head>

<body>

      <!-- Encabezado Corporativo utilizando la clase de tu CSS (.navbar-custom) -->
    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Control de Stock - Concesionaria</span>
        </div>
    </nav>

    <div class="container">
        <div class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h4 text-secondary mb-1">Listado de Autos Registrados</h2>
                    <p class="text-muted small mb-0">Administra el inventario de Vehículos, Altas, Bajas y Modificaciones</p>
                </div>
                
                <!-- BOTÓN VERDE PRINCIPAL: Abre el modal usando los atributos nativos de Bootstrap -->
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalRegistrarVehiculo">
                    + Registrar Vehículo
                </button>
            </div>

            <!-- Contenedor de la Tabla utilizando tu clase (.table-container) -->
            <div class="table-container table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Id</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Patente</th>
                            <th>Km</th>
                            <th>Fecha Ingreso</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <!-- ID CLAVE: Aquí es donde la función mostrarVehiculo(data) inyecta las filas -->
                    <tbody id="tablaVehiculo">
                        <!-- Se genera dinámicamente desde JavaScript al hacer el GET -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DE CREACIÓN (POST) -->
    <div class="modal fade" id="modalRegistrarVehiculo" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Registrar Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formVehiculo" onsubmit="event.preventDefault();">
                        <div class="mb-3">
                            <label for="Marca" class="form-label">Marca</label>
                            <input type="text" class="form-control" id="Marca" required>
                        </div>
                        <div class="mb-3">
                            <label for="Modelo" class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="Modelo" required>
                        </div>
                        <div class="mb-3">
                            <label for="Año" class="form-label">Año</label>
                            <input type="number" class="form-control" id="Año" required>
                        </div>
                        <div class="mb-3">
                            <label for="Patente" class="form-label">Patente</label>
                            <input type="text" class="form-control" id="Patente" required>
                        </div>
                        <div class="mb-3">
                            <label for="Km" class="form-label">(KM)</label>
                            <input type="number" class="form-control" id="Km" required>
                        </div>
                        <div class="mb-3">
                            <label for="FechaIngreso" class="form-label">Fecha de Ingreso</label>
                            <input type="text" class="form-control" id="FechaIngreso" required>
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="Disponible" checked>
                            <label class="form-check-label" for="Disponible">El vehículo está disponible para la venta</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <!-- RELACIÓN JS: Al hacer click ejecuta la función InscribirVehiculo() -->
                    <button type="button" class="btn btn-success" onclick="InscribirVehiculo()">Guardar Vehículo</button>
                </div>
            </div>
        </div>
    </div>

    <!--Modal Editar -->

   <dialog id="modalEditarVehiculo" class="modal-editar-custom">
    <!-- Encabezado Oscuro (Como tu Navbar) -->
    <div class="modal-header-custom">
        <h3>Editar Vehículo</h3>
        <button type="button" class="btn-close-custom" onclick="cerrarModal()">&times;</button>
    </div>

    <!-- Cuerpo del Formulario (Fondo gris claro) -->
    <div class="modal-body-custom">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Marca</label>
                <input type="text" id="editarMarca" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Modelo</label>
                <input type="text" id="editarModelo" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Año</label>
                <input type="number" id="editarAño" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Patente</label>
                <input type="text" id="editarPatente" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Kilómetros (Km)</label>
                <input type="number" id="editarKm" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label text-secondary fw-semibold">Fecha de Ingreso</label>
                <input type="text" id="editarFechaIngreso" class="form-control" />
            </div>
            <div class="col-12 mt-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="editarDisponible" />
                    <label class="form-check-label fw-semibold" for="Disponible">Vehículo Disponible</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de Acción Inferiores -->
    <div class="modal-footer-custom">
        <button type="button" class="btn btn-secondary px-3" onclick="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-primary px-4" onclick="GuardarCambiosEditar()">Guardar Cambios</button>
    </div>
</dialog>




    <script src="../bootstrap-5.0.2-dist/js/bootstrap.min.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/Vehiculo.js"></script>
</body>

</html>
